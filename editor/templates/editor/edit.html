<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit — {{ video.title }}</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #222633;
            --border: #2d3344;
            --text: #e8eaed;
            --text-muted: #9aa0b0;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --danger: #ef4444;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .back:hover {
            color: var(--text);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        input[type="file"] {
            padding: 12px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            margin-right: 12px;
            cursor: pointer;
            font-weight: 500;
        }

        .help {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .current-file {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            word-break: break-all;
        }

        .current-file a {
            color: #22d3ee;
            text-decoration: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="back">← Back to videos</a>

        <h1>Edit Video</h1>
        <p class="subtitle">Update the title or replace the original file.</p>

        <div class="card">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_title">Title</label>
                    <input type="text" name="title" id="id_title" value="{{ form.title.value|default:video.title }}"
                        required maxlength="200">
                </div>

                <div class="form-group">
                    <label>Current file</label>
                    <p class="current-file">
                        {% if video.original_file %}
                        <a href="{{ video.original_file.url }}" download>{{ video.original_file.name }}</a>
                        {% else %}
                        No file
                        {% endif %}
                    </p>

                    <label for="id_original_file">Replace video file (optional)</label>
                    <input type="file" name="original_file" id="id_original_file" accept="video/*">
                    <p class="help">Leave empty to keep the current file. Uploading a new file will clear any previous
                        processed version.</p>
                </div>

                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>
