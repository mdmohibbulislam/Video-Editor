<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete — {{ video.title }}</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2d3344;
            --text: #e8eaed;
            --text-muted: #9aa0b0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        .video-name {
            color: var(--text);
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            min-width: 120px;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #222633;
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Delete this video?</h1>
            <p>
                You are about to permanently delete<br>
                <span class="video-name">“{{ video.title }}”</span><br>
                and its files from the server. This cannot be undone.
            </p>

            <form method="post" class="actions">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>
